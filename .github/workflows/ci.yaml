name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The arguments mirror the Makefile `lint` target; the actions are used here so the job
      # does not have to install a Rust or Lua toolchain to obtain the two linters.
      - name: stylua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua plugin tests
      - name: luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: lua plugin tests

  test:
    name: test (neovim ${{ matrix.neovim }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 0.11 is the oldest minor version the plugin supports (the README requires it) and v0.11.7
        # its latest patch release; stable is already a later minor version, so the floor needs
        # its own entry.
        neovim:
          - v0.11.7
          - stable
          - nightly
    steps:
      - uses: actions/checkout@v7
      # Pinned to the master commit of 2026-04-10 so a change upstream cannot break the specs
      # unannounced; plenary.nvim is scheduled to be archived, so this commit is also its last
      # expected state.
      - name: Check out plenary.nvim
        uses: actions/checkout@v7
        with:
          repository: nvim-lua/plenary.nvim
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
          path: .deps/plenary.nvim
      # The release tarball is extracted directly: rhysd/action-setup-vim fails on ubuntu-26.04
      # because it renames across filesystems (/tmp to $HOME; its issue #80), and its nightly leg
      # only passes by falling back to a source build.
      - name: Install Neovim ${{ matrix.neovim }}
        env:
          NEOVIM_VERSION: ${{ matrix.neovim }}
        run: |
          url="https://github.com/neovim/neovim/releases/download/${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          curl -fsSL --retry 3 "$url" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version | head -1
      - name: Lua specs
        env:
          PLENARY_DIR: ${{ github.workspace }}/.deps/plenary.nvim
        run: make test

  browser:
    name: browser
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only immutable full-version tags since v8.0.0 (no floating major
      # tag exists), so this one action is pinned at its full latest release. Return to a
      # major-only pin if upstream publishes major tags again.
      - uses: astral-sh/setup-uv@v10.2.0
      # The ubuntu-26.04 image ships Google Chrome; the Makefile resolves it from PATH.
      - name: Headless Chrome checks
        run: make test-browser
